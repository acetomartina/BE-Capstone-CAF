spring.config.import=optional:file:./env.properties

spring.application.name=CAF-FAPI-Backend


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8080


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Invio mail. I default servono a non impedire l'avvio finche' l'SMTP
# non e' configurato: senza credenziali l'invio fallisce e viene loggato,
# ma l'applicazione parte e il resto del flusso resta usabile.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Recupero password
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.reset-password.mittente=${MAIL_MITTENTE:no-reply@caf-fapi-pianopoli.it}
app.reset-password.durata-minuti=${RESET_PASSWORD_DURATA_MINUTI:30}

app.super-admin.nome=${SUPER_ADMIN_NOME}
app.super-admin.cognome=${SUPER_ADMIN_COGNOME}
app.super-admin.codice-fiscale=${SUPER_ADMIN_CODICE_FISCALE}
app.super-admin.email=${SUPER_ADMIN_EMAIL}
app.super-admin.password=${SUPER_ADMIN_PASSWORD}