# ==========================================================
# PROFILO DI PRODUZIONE
# ==========================================================
#
# Si attiva con SPRING_PROFILES_ACTIVE=prod.
#
# Il principio e' che in produzione non deve finire nei log
# nulla che riguardi i dati delle persone, e non deve essere
# raggiungibile nulla che descriva la superficie dell'API.

# Nessuna query e nessun parametro bindato nei log.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security=WARN
logging.level.root=INFO

# La documentazione dell'API elenca ogni endpoint e ogni campo:
# utile in sviluppo, inutile e informativa per un attaccante qui.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# I dettagli tecnici di un errore restano nei log del server,
# non nel corpo della risposta.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Dietro reverse proxy: senza questo i link generati (attivazione,
# reset password) userebbero schema e host sbagliati.
server.forward-headers-strategy=framework
