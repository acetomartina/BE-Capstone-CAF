# ==========================================================
# PROFILO DI SVILUPPO
# ==========================================================
#
# Attivo per default (spring.profiles.default=dev).
#
# Qui sta tutto cio' che aiuta mentre si sviluppa ma che non
# deve raggiungere la produzione: le query in chiaro e - soprattutto -
# i parametri bindati, che contengono codici fiscali, email e
# hash delle password degli utenti veri.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
